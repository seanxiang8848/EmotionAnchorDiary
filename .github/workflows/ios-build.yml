# iOS 云端编译验证
# 每次上传代码后，GitHub 会自动分配一台云端 Mac 编译项目并运行单元与界面测试。
# 结果在仓库的 Actions 标签页查看：绿勾 = 编译通过；红叉 = 有错误（点进去可看详情）。

name: iOS Build Check

permissions:
  contents: read
  issues: write   # 编译失败时自动创建诊断 Issue

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:   # 允许在 Actions 页面手动点 "Run workflow" 触发

jobs:
  build-and-test:
    runs-on: macos-15   # GitHub 托管的云端 Mac

    steps:
      - name: 拉取项目代码
        uses: actions/checkout@v4

      - name: 选择 Xcode 版本
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: 显示编译环境
        run: xcodebuild -version

      - name: 编译 App（跳过签名，验证代码能否通过编译）
        run: |
          set -o pipefail
          set +e
          xcodebuild build \
            -project EmotionAnchorDiary.xcodeproj \
            -scheme EmotionAnchorDiary \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/build.log"
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$BUILD_STATUS" -ne 0 ]; then
            {
              echo "## 编译失败 · 错误摘要"
              echo ""
              echo '```'
              grep -E "error:" "$RUNNER_TEMP/build.log" | head -30
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            {
              echo "## CI 编译失败自动诊断"
              echo ""
              echo "- Commit: ${GITHUB_SHA}"
              echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo ""
              echo '### 错误摘要（error: 行）'
              echo '```'
              grep -E "error:" "$RUNNER_TEMP/build.log" | head -30 || true
              echo '```'
              echo '### 日志末尾 60 行'
              echo '```'
              tail -60 "$RUNNER_TEMP/build.log"
              echo '```'
            } > "$RUNNER_TEMP/ci-failure-issue.md"
          fi
          exit "$BUILD_STATUS"

      - name: 编译失败时创建诊断 Issue
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "$RUNNER_TEMP/ci-failure-issue.md" ]; then
            gh issue create \
              --title "CI 编译失败诊断 ${GITHUB_SHA:0:7}" \
              --body-file "$RUNNER_TEMP/ci-failure-issue.md"
          fi

      - name: 运行单元与界面测试（加密和隐私设置）
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next((device["udid"] for devices in data["devices"].values() for device in devices if device.get("isAvailable") and device["name"].startswith("iPhone")), ""))')"
          if [ -z "$SIMULATOR_ID" ]; then
            echo "没有找到可用的 iPhone 模拟器"
            xcrun simctl list devices available
            exit 1
          fi
          echo "使用模拟器 ID: $SIMULATOR_ID"
          RESULT_BUNDLE="$RUNNER_TEMP/EmotionAnchorDiaryTests.xcresult"
          set +e
          xcodebuild test \
            -project EmotionAnchorDiary.xcodeproj \
            -scheme EmotionAnchorDiary \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -resultBundlePath "$RESULT_BUNDLE" \
            CODE_SIGNING_ALLOWED=NO
          TEST_STATUS=$?
          set -e
          if [ -d "$RESULT_BUNDLE" ]; then
            echo "Xcode 测试摘要："
            # 这两条只是打印诊断信息，失败（例如 xcodebuild 崩溃导致 xcresult 没写完）
            # 不应改变 job 结果，否则退出码会变成 64 而不是 xcodebuild 的真实状态。
            xcrun xcresulttool get test-results summary --path "$RESULT_BUNDLE" || true
            echo "Xcode 测试详情："
            xcrun xcresulttool get test-results tests --path "$RESULT_BUNDLE" || true
          fi
          echo "xcodebuild 退出码：$TEST_STATUS"
          exit "$TEST_STATUS"

      - name: 上传 Xcode 失败诊断包
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: xcode-test-diagnostics-${{ github.run_number }}
          path: ${{ runner.temp }}/EmotionAnchorDiaryTests.xcresult
          if-no-files-found: ignore
          retention-days: 7
