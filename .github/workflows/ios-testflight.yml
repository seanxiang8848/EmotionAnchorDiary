# TestFlight 真机体验流水线（手动触发）
# 用法：仓库 → Actions → iOS TestFlight Upload → Run workflow
# 成功后约 10-30 分钟可在 iPhone 的 TestFlight APP 里安装体验
#
# 需要 4 个 Secrets：ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8_BASE64 / DEVELOPMENT_TEAM
# 详见 RELEASE_CHECKLIST.md 第一节

name: iOS TestFlight Upload

on:
  workflow_dispatch:

jobs:
  build-upload:
    runs-on: macos-15

    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}

    steps:
      - name: 拉取项目代码
        uses: actions/checkout@v4

      - name: 选择 Xcode 版本
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: 写入 App Store Connect API Key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -e
          if [ -z "$ASC_KEY_P8_BASE64" ] || [ -z "$ASC_KEY_ID" ]; then
            echo "缺少 ASC_KEY_P8_BASE64 或 ASC_KEY_ID，请先在仓库 Secrets 中配置"
            exit 1
          fi
          mkdir -p "$HOME/private_keys"
          echo "$ASC_KEY_P8_BASE64" | base64 -d > "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
          echo "密钥文件首行：$(head -1 \"$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8\")"
          echo "密钥文件字节数：$(wc -c < \"$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8\")"

      - name: 校验 App Store Connect 凭据（诊断用）
        run: |
          xcrun altool --list-apps \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            || echo "⚠️ 凭据校验失败：请检查 Key ID / Issuer ID / p8 是否正确，密钥角色是否为 App 管理"

      - name: 生成 IPA 导出配置
        run: |
          cat > ExportOptions.plist <<'PLIST_HEAD'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>uploadSymbols</key>
              <true/>
              <key>teamID</key>
              <string>TEAM_ID_PLACEHOLDER</string>
          </dict>
          </plist>
          PLIST_HEAD
          /usr/bin/sed -i '' "s/TEAM_ID_PLACEHOLDER/${{ secrets.DEVELOPMENT_TEAM }}/" ExportOptions.plist
          cat ExportOptions.plist

      - name: 打包 Archive（自动签名）
        run: |
          xcodebuild archive \
            -project EmotionAnchorDiary.xcodeproj \
            -scheme EmotionAnchorDiary \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/EmotionAnchorDiary.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: 导出 IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/EmotionAnchorDiary.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls -la "$RUNNER_TEMP/export"

      - name: 上传到 TestFlight
        run: |
          xcrun altool --upload-app --type ios \
            --file "$RUNNER_TEMP/export/EmotionAnchorDiary.ipa" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
          echo "上传完成，等待 Apple 处理（约 10-30 分钟）后在 TestFlight 可见"
