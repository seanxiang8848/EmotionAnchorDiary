# TestFlight 真机体验流水线（手动触发）
# 用法：仓库 → Actions → iOS TestFlight Upload → Run workflow
# 成功后约 10-30 分钟可在 iPhone 的 TestFlight APP 里安装体验
#
# 需要在仓库 Settings → Secrets and variables → Actions 配置 4 个密钥：
#   ASC_KEY_ID        App Store Connect API Key ID
#   ASC_ISSUER_ID     App Store Connect Issuer ID
#   ASC_KEY_P8_BASE64 AuthKey.p8 文件内容的 base64 编码
#   DEVELOPMENT_TEAM  Apple 开发者 Team ID（10 位）
# 详见仓库根目录 RELEASE_CHECKLIST.md 第一节

name: iOS TestFlight Upload

on:
  workflow_dispatch:

jobs:
  build-upload:
    runs-on: macos-15

    steps:
      - name: 拉取项目代码
        uses: actions/checkout@v4

      - name: 选择 Xcode 版本
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: 写入 App Store Connect API Key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -e
          if [ -z "$ASC_KEY_P8_BASE64" ] || [ -z "$ASC_KEY_ID" ]; then
            echo "缺少 ASC_KEY_P8_BASE64 或 ASC_KEY_ID，请先在仓库 Secrets 中配置"
            exit 1
          fi
          mkdir -p ~/private_keys
          echo "$ASC_KEY_P8_BASE64" | base64 -d > "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"

      - name: 生成 IPA 导出配置
        run: |
          cat > ExportOptions.plist <<'PLIST_HEAD'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>uploadSymbols</key>
              <true/>
              <key>teamID</key>
              <string>TEAM_ID_PLACEHOLDER</string>
          </dict>
          </plist>
          PLIST_HEAD
          sed -i '' "s/TEAM_ID_PLACEHOLDER/${{ secrets.DEVELOPMENT_TEAM }}/" ExportOptions.plist

      - name: 打包 Archive（自动签名）
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          xcodebuild archive \
            -project EmotionAnchorDiary.xcodeproj \
            -scheme EmotionAnchorDiary \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/EmotionAnchorDiary.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: 导出 IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/EmotionAnchorDiary.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls -la "$RUNNER_TEMP/export"

      - name: 上传到 TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --upload-app --type ios \
            --file "$RUNNER_TEMP/export/EmotionAnchorDiary.ipa" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
          echo "上传完成，等待 Apple 处理（约 10-30 分钟）后在 TestFlight 可见"
