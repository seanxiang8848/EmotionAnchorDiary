# TestFlight 真机体验流水线（手动触发）
# 用法：仓库 → Actions → iOS TestFlight Upload → Run workflow
# 成功后约 10-30 分钟可在 iPhone 的 TestFlight APP 里安装体验
#
# 需要 4 个 Secrets：ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8_BASE64 / DEVELOPMENT_TEAM
# 详见 RELEASE_CHECKLIST.md 第一节
#
# 签名策略：Archive 阶段不签名（开发签名会要求绑定设备，云端无设备），
# 在 -exportArchive 阶段用 App Store Connect API Key 做自动发布签名。
# 图标：ci-assets/AppIcon-1024.png.base64 在构建时还原为资源目录中的 PNG

name: iOS TestFlight Upload

on:
  workflow_dispatch:

jobs:
  build-upload:
    runs-on: macos-26

    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}

    steps:
      - name: 拉取项目代码
        uses: actions/checkout@v4

      - name: 选择最新 Xcode（Apple 要求 iOS 26 SDK 才能上传）
        run: |
          set -e
          echo "镜像中已安装的 Xcode："
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "  （未发现 /Applications/Xcode*.app）"
          XCODE_PATH="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$XCODE_PATH" ] && [ -d "$XCODE_PATH/Contents/Developer" ]; then
            echo "切换到：$XCODE_PATH"
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          else
            echo "未找到版本化 Xcode，沿用默认：$(xcode-select -p)"
          fi
          xcodebuild -version
          echo "iPhoneOS SDK 版本：$(xcrun --sdk iphoneos --show-sdk-version)"

      - name: 写入 App Store Connect API Key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -e
          if [ -z "$ASC_KEY_P8_BASE64" ] || [ -z "$ASC_KEY_ID" ]; then
            echo "缺少 ASC_KEY_P8_BASE64 或 ASC_KEY_ID，请先在仓库 Secrets 中配置"
            exit 1
          fi
          mkdir -p "$HOME/private_keys"
          echo "$ASC_KEY_P8_BASE64" | base64 -d > "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
          echo "密钥文件首行："
          head -1 "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"

      - name: 还原 APP 图标
        run: |
          set -e
          ICON_DIR="EmotionAnchorDiary/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICON_DIR"
          base64 -d -i "ci-assets/AppIcon-1024.png.base64" -o "$ICON_DIR/AppIcon-1024.png"
          SZ=$(wc -c < "$ICON_DIR/AppIcon-1024.png")
          echo "图标字节数：$SZ"
          if [ "$SZ" -lt 1000 ]; then
            echo "❌ 图标还原失败：解码后文件过小，请检查 ci-assets/AppIcon-1024.png.base64"
            exit 1
          fi
          /usr/bin/sips -g pixelHeight "$ICON_DIR/AppIcon-1024.png" || true

      - name: 校验 App Store Connect 凭据（诊断用）
        run: |
          xcrun altool --list-apps \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            || echo "⚠️ 凭据校验失败：请检查 Key ID / Issuer ID / p8 是否正确"

      - name: 生成 IPA 导出配置
        run: |
          cat > ExportOptions.plist <<'PLIST_HEAD'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>uploadSymbols</key>
              <true/>
              <key>teamID</key>
              <string>TEAM_ID_PLACEHOLDER</string>
              <key>destination</key>
              <string>export</string>
          </dict>
          </plist>
          PLIST_HEAD
          /usr/bin/sed -i '' "s/TEAM_ID_PLACEHOLDER/${{ secrets.DEVELOPMENT_TEAM }}/" ExportOptions.plist
          cat ExportOptions.plist

      - name: 打包 Archive（不签名，签名交给导出阶段）
        run: |
          xcodebuild archive \
            -project EmotionAnchorDiary.xcodeproj \
            -scheme EmotionAnchorDiary \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/EmotionAnchorDiary.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: 导出并签名 IPA（自动发布签名，仅导出不上传）
        run: |
          set -e
          rm -rf "$RUNNER_TEMP/export"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/EmotionAnchorDiary.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls -la "$RUNNER_TEMP/export"

      - name: 上传到 TestFlight
        run: |
          xcrun altool --upload-app --type ios \
            --file "$RUNNER_TEMP/export/EmotionAnchorDiary.ipa" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
          echo "上传完成，等待 Apple 处理（约 10-30 分钟）后在 TestFlight 可见"
